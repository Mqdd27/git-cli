[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "git-cli"
version = "0.1.0"
description = "Terminal UI for managing Git repositories"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "textual>=0.58,<1.0",
]

[project.scripts]
git-cli = "git_cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]
